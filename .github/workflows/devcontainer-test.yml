name: Devcontainer Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: devcontainer-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # runCmd proves the tooling inside the container works, not just that
      # the image builds — a container with broken make/shellcheck/gitleaks
      # used to pass this job.
      - name: Build root devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          subFolder: .
          push: never
          runCmd: |
            set -euo pipefail
            make doctor-ci
            make lint
            command -v gitleaks

  build-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build template devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          subFolder: templates
          push: never
          runCmd: |
            set -euo pipefail
            make help
            make doctor-ci
            command -v gitleaks
            test -x .mcp/node_modules/.bin/playwright-mcp
            test -x .mcp/node_modules/.bin/chrome-devtools-mcp
