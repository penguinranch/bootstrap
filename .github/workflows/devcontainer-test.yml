name: Devcontainer Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: devcontainer-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # runCmd proves the tooling inside the container works, not just that
      # the image builds — a container with broken make/shellcheck/gitleaks
      # used to pass this job.
      - name: Build root devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          subFolder: .
          push: never
          runCmd: |
            set -euo pipefail
            make doctor-ci
            make lint
            make test-toolchain
            command -v gitleaks
            pinned_node=$(grep -o '"version": "[0-9]*"' .devcontainer/devcontainer.json | grep -o '[0-9]*')
            node_major=$(node -p 'process.versions.node.split(".")[0]')
            [ "$node_major" = "$pinned_node" ] || { echo "node $node_major, but the feature pins $pinned_node"; exit 1; }
            gh --version
            git --version
            getent passwd "$(id -un)" | grep -q '/zsh$' || { echo "zsh is not the default shell"; exit 1; }
            docker info

  build-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build template devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          subFolder: templates
          push: never
          runCmd: |
            set -euo pipefail
            make help
            make doctor-ci
            node_major=$(node -p 'process.versions.node.split(".")[0]')
            [ "$node_major" = "$(cat .nvmrc)" ] || { echo "node $node_major, but .nvmrc pins $(cat .nvmrc)"; exit 1; }
            gh --version
            git --version
            getent passwd "$(id -un)" | grep -q '/zsh$' || { echo "zsh is not the default shell"; exit 1; }
            command -v gitleaks
            test -x .mcp/node_modules/.bin/playwright-mcp
            test -x .mcp/node_modules/.bin/chrome-devtools-mcp
            docker --version
            docker compose version
            docker info
