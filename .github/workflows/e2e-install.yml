name: E2E Install Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch
concurrency:
  group: e2e-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-browsers.sh refuses to run outside a container, so a bare runner fails 'make browsers'
      - name: Run the install e2e in the root devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          subFolder: .
          push: never
          env: |
            REPO_TAR_URL=https://github.com/${{ github.repository }}/tarball/${{ github.sha }}
          runCmd: make test
