version: 2
updates:
  # Maintain GitHub Actions used in this repo AND shipped in the template
  # payload. Dependabot only appends .github/workflows for the '/' directory;
  # any other directory is scanned literally, so the payload's workflows must
  # be listed by their full path.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/templates/.github/workflows'
    schedule:
      interval: 'weekly'
    # one PR across both directories: check-template-sync fails a half-bumped security.yml
    groups:
      actions:
        patterns: ['*']
        group-by: dependency-name

  # Maintain Docker base images in the root devcontainer and the template
  # payload's devcontainer
  - package-ecosystem: 'docker'
    directories:
      - '/.devcontainer'
      - '/templates/.devcontainer'
    schedule:
      interval: 'weekly'
    groups:
      docker-images:
        patterns: ['*']
        group-by: dependency-name

  # Maintain devcontainer features for this repo and the template payload
  - package-ecosystem: 'devcontainers'
    directories:
      - '/'
      - '/templates'
    schedule:
      interval: 'weekly'
    groups:
      devcontainer-features:
        patterns: ['*']
        group-by: dependency-name

  # Track the repo's own formatting toolchain (prettier in package.json) and
  # the MCP server pins shipped in the payload's .mcp/ manifest.
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/templates/.mcp'
    schedule:
      interval: 'weekly'
