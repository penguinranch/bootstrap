name: Security Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Least privilege by default; the scan job widens this for its SARIF upload.
permissions:
  contents: read

# Cancel redundant runs on the same branch
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true # SARIF upload requires GitHub Advanced Security (paid for private repos)
        with:
          sarif_file: 'trivy-results.sarif'
