name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Least privilege by default: a build needs to read the tree and nothing more.
# Any job that writes (releases, comments, SARIF) opts back in job-locally.
permissions:
  contents: read

# Cancel redundant runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Node.js Setup (replace with your stack) ---
      # If your project uses a different language, replace this section.
      # See AGENTS.md for instructions on mapping stack-specific commands to the Makefile.
      # Setup, install and test are gated on a lockfile existing, so a freshly
      # scaffolded project (no stack chosen yet) stays green on its first push.
      # Lint is not gated: shellcheck runs from day one, and prettier, cspell and
      # markdownlint join in once npm ci has installed them.
      - name: Note unconfigured stack
        if: hashFiles('package-lock.json') == ''
        run: echo "No package-lock.json found... stack not chosen yet, skipping install and test."

      - name: Use Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci --ignore-scripts

      - name: Lint
        run: make lint

      - name: Test
        if: hashFiles('package-lock.json') != ''
        run: make test

      # --- Python Setup (alternative) ---
      # For Python projects with a src/ layout, you may need PYTHONPATH:
      #   env:
      #     PYTHONPATH: src
